server:
  port: 8082

spring:
  application:
    name: ticket-service
  config:
    # Centralized config from config-server; optional so the service still boots
    # on the local defaults below when the config server is down.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ticket_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      enable-idempotence: true
      retries: 5
      properties:
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ticket-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.auction.common.event,com.auction.common.event.ticket"
    listener:
      ack-mode: manual_immediate
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          # This is the setting that stops the infinite redelivery loop. Without it, a
          # release that throws (MySQL blip, Redis blip) is requeued and redelivered
          # immediately, forever -- verified: with retry off, the failing message never
          # reaches the DLQ. Retry gives transient faults a few attempts, and its default
          # RejectAndDontRequeueRecoverer then rejects fatally, which routes the message to
          # the queue's dead-letter exchange (see RabbitMQConfig).
          enabled: true
          max-attempts: 3
          initial-interval: 1s
        # Belt and braces, and NOT what does the work above: while retry is enabled its
        # recoverer rejects fatally regardless of this flag. It matters only if retry is
        # ever turned off -- then this is what keeps a rejected message off the queue.
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

logging:
  level:
    com.auction.ticket: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    # Single-host dev: register the loopback IP, otherwise a WSL/virtual adapter
    # IP gets registered and the host-run gateway cannot reach it (503).
    prefer-ip-address: true
    ip-address: 127.0.0.1
