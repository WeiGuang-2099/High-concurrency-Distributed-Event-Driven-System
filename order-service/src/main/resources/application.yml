server:
  port: 8083

spring:
  application:
    name: order-service
  config:
    # Centralized config from config-server; optional so the service still boots
    # on the local defaults below when the config server is down.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      enable-idempotence: true
      retries: 5
      properties:
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.auction.common.event,com.auction.common.event.order,com.auction.common.event.ticket"
    listener:
      ack-mode: manual_immediate
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          # Stops the infinite redelivery loop: without it a timeout message that throws
          # is requeued and redelivered immediately, forever, and every order behind it
          # stops expiring. Retry covers transient faults, then its default
          # RejectAndDontRequeueRecoverer rejects fatally, routing to the DLX.
          # Verified on the identical ticket-service queue by StockReleaseTimeoutIT.
          enabled: true
          max-attempts: 3
          initial-interval: 1s
        # Belt and braces, not what does the work above; only matters if retry is disabled.
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

payment:
  mock:
    success-rate: 0.95
    min-latency-ms: 500
    max-latency-ms: 2000

logging:
  level:
    com.auction.order: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    # Single-host dev: register the loopback IP, otherwise a WSL/virtual adapter
    # IP gets registered and the host-run gateway cannot reach it (503).
    prefer-ip-address: true
    ip-address: 127.0.0.1
