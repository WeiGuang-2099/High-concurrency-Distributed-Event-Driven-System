server:
  port: 8084

spring:
  application:
    name: notification-service
  config:
    # Centralized config from config-server; optional so the service still boots
    # on the local defaults below when the config server is down.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/notification_db?authSource=admin
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    # Single-host dev: register the loopback IP, otherwise a WSL/virtual adapter
    # IP gets registered and the host-run gateway cannot reach it (503).
    prefer-ip-address: true
    ip-address: 127.0.0.1
