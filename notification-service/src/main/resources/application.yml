server:
  port: 8084

spring:
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        # Single-host dev: pin loopback, otherwise a WSL/virtual adapter IP gets
        # registered and the host-run gateway cannot reach it (503).
        ip: 127.0.0.1
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/notification_db?authSource=admin
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
